org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Configure only the projects a requested task actually needs. In this sandbox
# (no Android SDK, no reachable Google Maven repo) this is what lets
# `./gradlew :core-domain:test` succeed without ever touching the `app`
# module's AGP/Hilt/KSP plugin resolution. See build.gradle.kts for the full
# explanation.
org.gradle.configureondemand=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
